<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Library</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
        <span class="logo-icon">📚</span>
            <div>
                <h1>My Library</h1>
                <p>Sua biblioteca pessoal</p>
            </div>
        </div>

        <button id="new-book-btn" class="new-book-btn">
            <span>+</span>
            Novo livro
        </button>
    </header>


    <main class="main">

        <section class="library-header">

            <div>
                <h2>Minha biblioteca</h2>
                <p id="book-count">0 livros</p>
            </div>

        </section>


        <section id="library" class="library">
            <!-- Os livros serão adicionados pelo JavaScript -->
        </section>


        <section id="empty-library" class="empty-library">

            <div class="empty-icon">
                📖
            </div>

            <h2>Sua biblioteca está vazia</h2>

            <p>
                Adicione seu primeiro livro para começar
                a organizar sua biblioteca.
            </p>

            <button id="empty-new-book-btn" class="new-book-btn">
                <span>+</span>
                Adicionar primeiro livro
            </button>

        </section>

    </main>


    <!-- Modal do formulário -->

    <dialog id="book-dialog">

        <div class="dialog-header">

            <div>
                <h2>Adicionar novo livro</h2>
                <p>Preencha as informações do livro.</p>
            </div>

            <button id="close-dialog" class="close-btn">
                ×
            </button>

        </div>


        <form id="book-form">

            <div class="form-group">
                <label for="title">Título</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Ex: O Hobbit"
                    required
                >
            </div>


            <div class="form-group">
                <label for="author">Autor</label>

                <input
                    type="text"
                    id="author"
                    name="author"
                    placeholder="Ex: J.R.R. Tolkien"
                    required
                >
            </div>


            <div class="form-group">
                <label for="pages">Número de páginas</label>

                <input
                    type="number"
                    id="pages"
                    name="pages"
                    placeholder="Ex: 295"
                    min="1"
                    required
                >
            </div>


            <label class="checkbox-container">

                <input
                    type="checkbox"
                    id="read"
                    name="read"
                >

                <span>Já li este livro</span>

            </label>


            <div class="form-actions">

                <button
                    type="button"
                    id="cancel-btn"
                    class="cancel-btn"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Adicionar livro
                </button>

            </div>

        </form>

    </dialog>


    <script src="script.js"></script>

</body>

</html>
